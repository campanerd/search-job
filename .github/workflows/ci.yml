name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      # Para corrigir localmente: mvn spring-javaformat:apply
      - name: Check Java format
        run: mvn -B -ntp spring-javaformat:validate

  build:
    name: Build and OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      # Compila, sobe o app, gera target/openapi.json e derruba o app
      - name: Build and generate OpenAPI
        run: mvn -B -ntp verify -Popenapi

      - uses: actions/upload-artifact@v7
        with:
          name: openapi
          path: target/openapi.json

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Generate Bruno collection
        run: >
          npx -y @usebruno/cli@4.3.0 import openapi
          --source target/openapi.json
          --output bruno
          --collection-name search-job
          --collection-format=bru

      - uses: actions/upload-artifact@v7
        with:
          name: bruno-collection
          path: bruno

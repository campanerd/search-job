spring:
  application:
    name: search-job
  datasource:
    url: jdbc:sqlite:data/search-job.db
    hikari:
      # SQLite aceita uma escrita por vez; mais de uma conexão só gera "database is locked"
      maximum-pool-size: 1
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    # O Hibernate não traz dialeto do SQLite no núcleo; vem do hibernate-community-dialects
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      # O Flyway cria as tabelas; o Hibernate só confere se batem com as entidades
      ddl-auto: validate

server:
  port: 8765
